name: verify-daily

# 延後獨立驗證班：收盤價健檢 + 必要時重抓修復。
#
# 為什麼要另開一班而不在 daily.yml 裡驗：healthcheck 比對的權威源就是 pipeline 剛用過的
# FinMind TaiwanStockPrice，同一次排程內前後相隔幾秒必然拿到同一份回應，severity 恆為 ok
# ——2026-06-26 那類「排程早於 FinMind settle、922 檔價格是暫定值」的事故完全驗不出來。
# 隔數小時後 FinMind 通常已 settle，此時比對才有鑑別力，重抓也才真的能修好。

on:
  schedule:
    # 15:40 UTC = 23:40 台北，週一~五（daily.yml 21:19 台北跑完後 ~2.5 小時）
    - cron: "40 15 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "指定交易日 YYYY-MM-DD（留空＝最新 daily）"
        required: false
      no_fix:
        description: "只驗不修（true/false）"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write    # 失敗告警開 issue 用

concurrency:
  group: daily-flows      # 與 daily.yml 同群組排隊，避免與每日排程同時寫 data/
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # push 前要 rebase

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Verify daily close prices
        id: verify
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          # 經由 env 傳入，不要把 inputs 直接內插進 shell（dispatch 輸入可注入指令）
          IN_DATE: ${{ github.event.inputs.date }}
          IN_NO_FIX: ${{ github.event.inputs.no_fix }}
        run: |
          args=""
          [ -n "$IN_DATE" ] && args="--date $IN_DATE"
          [ "$IN_NO_FIX" = "true" ] && args="$args --no-fix"
          # 退出碼先記下來、等 commit 完再決定 job 成敗，免得驗證結果與已修好的
          # 資料因為 job 中止而沒被推上去（0=沒事 / 1=價格事故 / 2=這次驗不了）
          set +e
          python src/verify_daily.py $args
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "無變更，略過 commit"; exit 0
          fi
          # no-op 守門（src/noop_guard.py，2026-09-06）：staged 的 data/*.json 若去掉頂層
          # generated_at／checked_at／last_attempt_at 後與 HEAD 完全相同，就不 commit——
          # 冪等重跑每次都改時戳，原本每交易日 3 次 commit 有 7/12 是純時戳 no-op（~4MB/次）。
          # 退出碼 0=NOOP、1=有真變化、2=守門自己失敗（視同有變化，照常 commit，fail-safe）。
          # status.json 的 status／expected_date／last_success_at 變化都算真變化，missing 一定推得上去。
          rc=0; python src/noop_guard.py || rc=$?
          if [ "$rc" = "0" ]; then
            echo "內容無變化（只有時間戳不同），略過 commit"; exit 0
          fi
          d=$(python -c "import json;print(json.load(open('data/status.json'))['date'])")
          sev=$(python -c "import json;print(json.load(open('data/status.json')).get('healthcheck',{}).get('severity','?'))")
          git commit -m "verify: $d price healthcheck=$sev [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" \
              && { echo "已推送（嘗試 $i）"; exit 0; }
            echo "遠端有更新或推送衝突，rebase 後重試 $i…"; sleep 5
          done
          echo "::error::push 重試 5 次仍失敗"; exit 1

      # rc=2（權威源查不到／無 daily 檔／健檢自己丟例外）只當警告：那是「這次驗不了」，
      # 不是價格事故。若跟 critical 一樣亮紅，FinMind 每掛一次就叫一次狼來了，
      # 真的出事時就沒人看了。status.json.healthcheck.severity 會記成 unknown。
      # 例外：status.json.status 仍為 missing（預期交易日缺料、verify 重跑 pipeline 也補不回）
      # 是真的出事，不是「驗不了」——要亮紅（2026-09-06；daily.yml 那邊已先告警過一次，
      # 這裡再叫一次是因為 verify 是最後一道補救，補不回就該有人看）。
      - name: Warn if verification could not run
        if: steps.verify.outputs.rc == '2'
        run: |
          st=$(python -c "import json;print(json.load(open('data/status.json')).get('status','?'))" 2>/dev/null || echo "?")
          if [ "$st" = "missing" ]; then
            echo "::error::預期交易日仍缺料（status=missing）：verify 重跑 pipeline 也無資料。"
            echo "::error::若當日為國定假日屬誤報（repo 無假日行事曆），否則請查 FinMind 或手動補跑。"
            exit 1
          fi
          echo "::warning::本次無法完成收盤價驗證（權威源查詢失敗／無 daily 檔）——"
          echo "::warning::不代表資料有問題；稍後可手動 workflow_dispatch 重驗。"

      - name: Fail if still critical
        if: steps.verify.outputs.rc == '1'
        run: |
          echo "::error::收盤價健檢仍為 critical（重抓後未修復）——FinMind 可能尚未 settle。"
          echo "::error::衍生產出已跟著重抓後的 daily 重算（維持一致），但值仍可疑。"
          echo "::error::可稍後手動 workflow_dispatch 本 workflow，或跑 python src/verify_daily.py"
          exit 1

      - name: Notify failure
        # cancelled 也要告警：跑一半被取消（GitHub 端異常或誤按）同樣代表該場沒產出，
        # 而 failure() 在 cancelled 時不成立（2026-07-24 postmkt pm 場靜默消失的教訓）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-failure
        with:
          pipeline: taiwan-flows-verify
