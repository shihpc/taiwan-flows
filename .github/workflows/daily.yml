name: daily-flows

on:
  schedule:
    # 21:19 台北 = 13:19 UTC，週一~週五（TaiwanStockShareholding 外資持股官方 21:00 才更新，
    # 21:00 整起跑會踩到未更新的持股資料；延後 19 分留緩衝＋冷門分鐘避開整點壅塞，
    # 2026-07-14 依審計調整，原 21:00。非交易日由程式自行跳過）
    #（雙觸發機制：taiwan-flow-live-v2 的 Cloudflare Worker「FinMind 哨兵」會在台北
    # 19:00-23:00 每 5 分探測法人買賣超/外資持股落地，一落地即 workflow_dispatch 本
    # workflow，通常比這條 cron 早跑；cron 保留當備援，管線冪等、多跑無害。
    # 哨兵程式：taiwan-flow-live-v2/worker/src/index.js 的 runSentinel）
    - cron: "19 13 * * 1-5"
  workflow_dispatch: {}   # GitHub App 手動觸發＋FinMind 哨兵自動觸發

# 讓 GITHUB_TOKEN 能 push commit
permissions:
  contents: write
  issues: write    # 失敗告警開 issue 用

concurrency:
  group: daily-flows
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 55 分：下方重試迴圈最多 3 次 run_daily（各約 3~5 分）＋ 2 次 sleep 600（共 20 分），
    # 原本的 30 分會在第三次嘗試中途被 timeout 砍掉——而 job 被砍時「Commit & push」
    # 這個 step 根本不會執行，等於前兩次已經抓好的資料整包丟掉。
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 完整歷史，push 前 rebase 才穩（淺層 clone 會讓 rebase 出錯）

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run daily pipeline + budget (retry up to 3x / 10min)
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          status=""
          for attempt in 1 2 3; do
            echo "::group::attempt $attempt"
            python src/run_daily.py || echo "run_daily 非零退出（將依 status 判斷重試）"
            echo "::endgroup::"
            status=$(python -c "import json;print(json.load(open('data/status.json'))['status'])" 2>/dev/null || echo error)
            echo "status=$status"
            # status 語意（src/run_daily.py classify_no_data，2026-09-06）：
            #   ok       已產出                       → 結束
            #   no_data  週末非交易日                 → 結束（正常沒資料）
            #   waiting  平日、台北 20:00 發布截止前   → 結束、不重試（哨兵/備援 cron 下一班會再來）
            #   missing  平日、已過截止仍無資料        → 重試；用盡後 job 失敗（真交易日缺料不可靜默）
            #   error    pipeline 丟例外              → 重試；用盡後 job 失敗
            # 舊版把 no_data 與 ok 同等看待且從不失敗，真交易日缺料會被靜默吞掉（2026-08-01 事故）。
            if [ "$status" = "ok" ] || [ "$status" = "no_data" ] || [ "$status" = "waiting" ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "資料缺料/錯誤（$status），10 分鐘後重試…"
              sleep 600
            fi
          done
          # 三次仍 missing / error 才讓 job 失敗（觸發 notify-failure 告警）。
          # missing 若是國定假日屬誤報（repo 無假日行事曆來源，見 classify_no_data 註解），可接受。
          if [ "$status" = "error" ] || [ "$status" = "missing" ]; then
            echo "::error::三次嘗試後仍 $status（預期交易日缺料或管線錯誤）"
            exit 1
          fi

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "無變更，略過 commit"; exit 0
          fi
          d=$(python -c "import json;print(json.load(open('data/status.json'))['date'])")
          git commit -m "data: $d daily flows [skip ci]"
          # push 前先 rebase 遠端最新（避免期間有前端等 commit 推入而被拒）；衝突重試
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" \
              && { echo "已推送（嘗試 $i）"; exit 0; }
            echo "遠端有更新或推送衝突，rebase 後重試 $i…"; sleep 5
          done
          echo "::error::push 重試 5 次仍失敗"; exit 1

      - name: Notify failure
        # cancelled 也要告警：跑一半被取消（GitHub 端異常或誤按）同樣代表該場沒產出，
        # 而 failure() 在 cancelled 時不成立（2026-07-24 postmkt pm 場靜默消失的教訓）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-failure
        with:
          pipeline: taiwan-flows-daily
